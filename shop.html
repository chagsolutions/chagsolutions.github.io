AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/Z";
const ORDER_TO="chagsolutionsusa@gmail.com",WA_NUM="18455359994";
/* Stripe later: set STRIPE_CHECKOUT (function: order -> URL) and it is used after the order is saved. */
const STRIPE_CHECKOUT=null;
const $=s=>document.querySelector(s),money=n=>'$'+n.toLocaleString('en-US');
let PS=[],cart={};
const units=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const unitPrice=p=>units()>=2&&p.neighborPrice?p.neighborPrice:p.price;
function calc(){let lines=[],tot=0,base=0;PS.filter(p=>p.status!=='coming-soon').forEach(p=>{const q=cart[p.id]||0;if(q){const u=unitPrice(p);lines.push({p,q,u});tot+=q*u;base+=q*p.price}});return{lines,tot,base,save:base-tot}}
function render(){
 const c=calc();
 $('#products').innerHTML=PS.map(p=>{const q=cart[p.id]||0;
  if(p.status==='coming-soon')return `<div class="prod coming-soon"><img src="${p.image}" alt="PHLUX - new product coming soon"><div class="b"><h3>${p.name}</h3><div class="coming-soon-badge">Coming soon</div><p>New product from CHAG Solutions. Not available to order yet.</p><div class="qty big"><button type="button" disabled aria-label="Decrease PHLUX quantity">-</button><span>0</span><button type="button" disabled aria-label="Increase PHLUX quantity">+</button></div><div class="coming-soon-controls"><button class="btn" type="button" disabled>Order now</button><button class="btn ghost" type="button" disabled>Order on WhatsApp</button></div></div></div>`;
  return `<div class="prod"><img src="${p.image==="@PRODIMG"?PRODIMG:p.image}" alt="${p.name}"><div class="b"><h3>${p.name}</h3><div class="pr">${money(p.price)} <small>${p.priceNote||''}</small></div>${p.neighborPrice?`<div class="deal">Buy 2+ and get ${money(p.price-p.neighborPrice)} discount per unit.</div>`:''}
  <div class="qty big"><button type="button" data-dec="${p.id}" aria-label="Less">-</button><span>${q}</span><button type="button" data-inc="${p.id}" aria-label="More">+</button></div></div></div>`}).join('');
 const n=units();
 $('#tot').textContent=money(c.tot);
 $('#sv').textContent=c.save>0?'You save '+money(c.save):'';
 $('#sb').disabled=!n;
 $('#wa').href='https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(n?'Hi, I want to order '+c.lines.map(l=>l.q+' x '+l.p.name).join(', ')+' ('+money(c.tot)+').':'Hi, I want to order.');
}
document.addEventListener('click',e=>{const t=e.target;
 if(t.dataset.inc&&PS.some(p=>p.id===t.dataset.inc&&p.status!=='coming-soon')){cart[t.dataset.inc]=(cart[t.dataset.inc]||0)+1;render()}
 if(t.dataset.dec&&PS.some(p=>p.id===t.dataset.dec&&p.status!=='coming-soon')&&cart[t.dataset.dec]>0){cart[t.dataset.dec]--;render()}
});
function orderText(o){return 'NEW ORDER '+o.id+'\n'+o.lines.map(l=>l.q+' x '+l.name+' @ '+money(l.u)).join('\n')+'\nTOTAL: '+money(o.tot)+'\nName: '+o.name+'\nPhone: '+o.phone+'\nAddress: '+o.address}
$('#of').addEventListener('submit',async e=>{e.preventDefault();
 const c=calc();if(!c.lines.length)return;
 const f=new FormData(e.target);if(f.get('website'))return;
 const o={id:'CHAG-'+Date.now().toString(36).toUpperCase(),lines:c.lines.map(l=>({name:l.p.name,q:l.q,u:l.u})),tot:c.tot,save:c.save,name:f.get('name'),phone:f.get('phone'),address:f.get('address')};
 const btn=$('#sb');btn.disabled=true;btn.textContent='Sending...';
 const text=orderText(o);let ok=false;
 try{const r=await fetch('https://formsubmit.co/ajax/'+ORDER_TO,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({_subject:'New TETRIPH order '+o.id+' - '+money(o.tot),_template:'box',_captcha:'false',name:o.name,phone:o.phone,address:o.address,order:text})});const j=await r.json();ok=(j.success===true||j.success==='true')}catch(err){}
 const wa='https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(text);
 $('#ordbox').style.display='none';
 const d=$('#done');d.style.display='block';
 d.innerHTML=ok?`<h2>Thank you!</h2><p class="lead">We will call you soon.</p><p style="color:#9a9a9a">Order ${o.id}</p>`
 :`<h2>Almost done</h2><p><a class="btn big" href="${wa}">Send order on WhatsApp</a></p>`;
 if(ok&&STRIPE_CHECKOUT){const u=STRIPE_CHECKOUT(o);if(u)location.href=u}
 d.scrollIntoView({behavior:'smooth'});
});
fetch("products.json").then(r=>r.json()).then(ps=>{PS=ps;const first=ps.find(p=>p.status!=='coming-soon');if(first)cart[first.id]=1;render()});
</script></body></html>
