const WA_NUM="18455359994";

const $=s=>document.querySelector(s),money=n=>'$'+n.toLocaleString('en-US');
let PS=[],cart={};
const units=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const unitPrice=p=>units()>=2&&p.neighborPrice?p.neighborPrice:p.price;
function calc(){let lines=[],tot=0,base=0;PS.forEach(p=>{const q=cart[p.id]||0;if(q){const u=unitPrice(p);lines.push({p,q,u});tot+=q*u;base+=q*p.price}});const discount=0;return{lines,tot:tot-discount,base,save:base-tot,discount}}
function render(){
 const c=calc();
 $('#products').innerHTML=PS.map(p=>{const q=cart[p.id]||0;const img=p.image==="@PRODIMG"?PRODIMG:p.image;
  if(p.status==='coming-soon')return `<div class="prod soon"><img src="${img}" alt="${p.name}"><div class="b"><h3>${p.name}</h3><div class="pr soon-t">new product coming soon</div><div class="qty big off" aria-disabled="true"><button type="button" disabled aria-label="Less">-</button><span>0</span><button type="button" disabled aria-label="More">+</button></div></div></div>`;
  return `<div class="prod"><img src="${img}" alt="${p.name}"><div class="b"><h3>${p.name}</h3><div class="pr">${money(p.price)} <small>${p.priceNote||''}</small></div>${p.neighborPrice?`<div class="deal">Buy 2+ and get ${money(p.price-p.neighborPrice)} discount per unit.</div>`:''}
  <div class="qty big"><button type="button" data-dec="${p.id}" ${q===0?'disabled':''} aria-label="Less">-</button><span>${q}</span><button type="button" data-inc="${p.id}" aria-label="More">+</button></div></div></div>`}).join('');
 $('#cl').innerHTML=c.lines.length?c.lines.map(l=>`<div class="cl"><span>${l.p.name} <b>x ${l.q}</b></span><span>${money(l.q*l.u)}</span></div>`).join(''):'<div class="cl empty">Cart is empty</div>';
 const n=units();
 $('#tot').textContent=money(c.tot);
 $('#sv').textContent=c.save>0?'You save '+money(c.save):'';
 $('#sb').disabled=!n;
 $('#wa').setAttribute('aria-disabled',String(!n));
 $('#wa').tabIndex=n?0:-1;
 if(!n){$('#wa').removeAttribute('href');return}
 $('#wa').href='https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(n?'Hi, I want to order '+c.lines.map(l=>l.q+' x '+l.p.name).join(', ')+' ('+money(c.tot)+').':'Hi, I want to order.');
}
document.addEventListener('click',e=>{const t=e.target;
 if(t.closest('#wa')){e.preventDefault();const c=calc(),form=document.getElementById('of');if(!c.lines.length||!validateOrderFields())return;const f=new FormData(form);const text=['Hi, I want to place an order.','', 'Name: '+f.get('firstName')+' '+f.get('lastName'),'Phone: '+f.get('phone'),'Email: '+f.get('email'),'Street: '+f.get('street'),'City: '+f.get('city'),'State: '+f.get('state'),'ZIP: '+f.get('zip'),'', 'Items:',...c.lines.map(l=>l.q+' x '+l.p.name+' @ '+money(l.u)+' = '+money(l.q*l.u)), 'Total: '+money(c.tot)].join('\n');window.chagWhatsAppPreview=text;location.href='https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(text);return}
 if(t.dataset.inc){cart[t.dataset.inc]=(cart[t.dataset.inc]||0)+1;render()}
 if(t.dataset.dec&&cart[t.dataset.dec]>0){cart[t.dataset.dec]--;render()}
});

const phoneInput=document.getElementById('phone'),emailInput=document.getElementById('email');
function phoneDigits(value){const digits=value.replace(/\D/g,'');return digits.length===11&&digits[0]==='1'?digits.slice(1):digits}
function formatPhone(value){if(!/^[+()\d\s.-]*$/.test(value))return value;const raw=value.replace(/\D/g,'');const prefix=/^\+1/.test(value.trim());const d=prefix?raw.slice(1):phoneDigits(value);if(d.length>10)return value;const formatted=[d.slice(0,3),d.slice(3,6),d.slice(6)].filter(Boolean).join('-');return (prefix?'+1 ':'')+formatted}
function checkContact(input,show){const value=input.value.trim();const valid=input===phoneInput?/^[2-9]\d{2}[2-9]\d{6}$/.test(phoneDigits(value))&&/^[+()\d\s.-]*$/.test(value):/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)&&!input.validity.typeMismatch;input.setCustomValidity(valid?'':input===phoneInput?'Invalid phone number':'Invalid email address');const visible=show&&!valid;input.setAttribute('aria-invalid',String(visible));document.getElementById(input.id+'-error').hidden=!visible;return valid}
phoneInput.addEventListener('input',()=>{const pos=phoneInput.selectionStart;const count=phoneInput.value.slice(0,pos).replace(/\D/g,'').length;const atEnd=pos===phoneInput.value.length;phoneInput.value=formatPhone(phoneInput.value);let caret=0,n=0;while(caret<phoneInput.value.length&&n<count){if(/\d/.test(phoneInput.value[caret]))n++;caret++}phoneInput.setSelectionRange(atEnd?phoneInput.value.length:caret,atEnd?phoneInput.value.length:caret);checkContact(phoneInput,phoneInput.getAttribute('aria-invalid')==='true')});
emailInput.addEventListener('input',()=>checkContact(emailInput,emailInput.getAttribute('aria-invalid')==='true'));
[phoneInput,emailInput].forEach(input=>{input.addEventListener('blur',()=>checkContact(input,true));input.addEventListener('invalid',e=>{e.preventDefault();checkContact(input,true)})});



const requiredOrderFields={first:'First name',last:'Last name',phone:'Phone number',email:'Email address',street:'Street address',city:'City',state:'State',zip:'ZIP code'};
const orderErrors=document.createElement('div');orderErrors.id='order-errors';orderErrors.className='sr-only';orderErrors.setAttribute('role','alert');orderErrors.hidden=true;document.getElementById('sb').before(orderErrors);
Object.entries(requiredOrderFields).forEach(([id,label])=>{const input=document.getElementById(id);input.required=true;input.addEventListener('input',()=>{if(!orderErrors.hidden)validateOrderFields(false)});if(!document.getElementById(id+'-error')){const error=document.createElement('span');error.id=id+'-error';error.className='field-error';error.hidden=true;input.after(error)}input.setAttribute('aria-describedby',id+'-error')});
function validateOrderFields(focus=true){let messages=[],firstBad;Object.entries(requiredOrderFields).forEach(([id,label])=>{const input=document.getElementById(id),error=document.getElementById(id+'-error');let text='';if(!input.value.trim())text='Enter '+label.toLowerCase()+'.';else if(id==='phone'&&!checkContact(input,false))text='Enter a valid phone number.';else if(id==='email'&&!checkContact(input,false))text='Enter a valid email address.';error.textContent=text;error.hidden=!text;input.setAttribute('aria-invalid',String(!!text));input.setCustomValidity(text);if(text){messages.push(text);if(!firstBad)firstBad=input}});orderErrors.textContent=messages.length?'Complete all fields to place your order: '+messages.join(' '):'';orderErrors.hidden=!messages.length;if(firstBad&&focus){firstBad.focus();firstBad.scrollIntoView({block:'center',behavior:'smooth'})}return !messages.length}

// No order is sent and no payment is collected until the payment service is connected.
$('#of').addEventListener('submit',e=>{e.preventDefault();
 const c=calc();if(!c.lines.length||!validateOrderFields())return;
 const f=new FormData(e.target);
 const order={promo:null,lines:c.lines.map(l=>({name:l.p.name,q:l.q,u:l.u})),tot:c.tot,save:c.save,firstName:f.get('firstName'),lastName:f.get('lastName'),phone:f.get('phone'),email:f.get('email'),street:f.get('street'),city:f.get('city'),state:f.get('state'),zip:f.get('zip')};
 try{sessionStorage.setItem('chagPendingOrder',JSON.stringify(order))}catch(err){alert('Please allow session storage to continue to the next page.');return}
 location.href='shop/payment/';
});
fetch("products.json").then(r=>r.json()).then(ps=>{PS=ps;render()});
</script><script src="shop/address.js"></script></body></html>
