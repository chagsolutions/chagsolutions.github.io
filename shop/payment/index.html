<!doctype html><html lang="en"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment - Chag Solutions</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"><style>.payment{max-width:640px;margin:36px auto}.form{max-width:none}.form label{display:block;color:#ccc;font-size:14px;margin-bottom:7px}.form input{width:100%;box-sizing:border-box;min-width:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form input:disabled{color:#888;background:#171717}.notice{background:#242424;border-radius:12px;padding:16px;line-height:1.6;color:#ccc}.summary{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #333}.back{display:inline-block;margin-bottom:18px;color:#FF7800}h1{font-size:38px;margin:0 0 24px}.btn:disabled{opacity:1;background:#414141;color:#999;cursor:not-allowed}@media(max-width:480px){h1{font-size:32px}.form input{font-size:16px}}.triple{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px}.triple label{min-height:36px}.check{display:flex!important;align-items:center;gap:10px;margin:8px 0}.check input{width:20px;height:20px;accent-color:#FF7800}.card-input{position:relative}.card-input input{padding-right:80px}.brand{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;border:1px solid #777;border-radius:4px;padding:4px 6px;line-height:1.1}.brand:empty{display:none}#billing{display:grid;gap:12px}#billing[hidden]{display:none}#sample-demo{margin-top:18px}.demo-note{font-size:14px;color:#aaa}.address-results:empty{display:none}.address-results{background:#222;border:1px solid #555;border-radius:12px;overflow:hidden;margin-top:3px}.address-option{width:100%;background:none;border:0;border-bottom:1px solid #444;text-align:left;color:#fff;padding:12px;font:inherit;cursor:pointer}.address-option:hover,.address-option.selected{background:#444}.address-credit{font-size:12px;color:#888;margin:0}.address-credit a{color:#aaa;text-decoration:underline}.dropdown-credit{padding:9px 12px;background:#181818;font-size:12px;line-height:1.4;color:#aaa}.dropdown-credit a{color:#aaa;text-decoration:underline}[hidden]{display:none!important}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;min-height:48px;padding:10px 24px;line-height:1.35}.btn.big{min-height:52px}.btn.small{min-height:44px;padding:8px 16px}.btn+.btn{margin-left:12px}.actions,.cta,.buttons{display:flex;flex-wrap:wrap;gap:12px}.actions>.btn,.cta>.btn,.buttons>.btn{margin-left:0}.qty{gap:12px}.qty button{border-radius:999px;min-width:44px;min-height:44px}.form>.btn,form>.btn{margin-top:20px}.field-row{gap:16px}</style><style>.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;min-height:48px;padding:10px 24px;line-height:1.35}.btn.big{min-height:52px}.btn.small{min-height:44px;padding:8px 16px}.btn+.btn{margin-left:12px}.actions,.cta,.buttons{display:flex;flex-wrap:wrap;gap:12px}.actions>.btn,.cta>.btn,.buttons>.btn{margin-left:0}.qty{gap:12px}.qty button{border-radius:999px;min-width:44px;min-height:44px}.form>.btn,form>.btn{margin-top:20px}.field-row{gap:16px}
.form .btn,.cartbox .btn,.payment .btn{border-radius:999px;min-height:48px;font-size:16px;padding:10px 24px}.form>#wa,.form>#sb{width:100%;margin-left:0}.form>#wa{margin-top:12px}.qty button{width:44px;height:44px;min-height:44px}.location-use{min-height:44px;padding:10px 0}.btn+.btn{margin-left:0}.btn.small{min-height:44px;font-size:14px}.field-row,.address-row,.pair,.triple{gap:16px}
</style></head><body><header id="hdr"></header><main><section style="padding-top:40px"><div class="wrap"><div class="cartbox payment"><a class="back" href="shop/">← Back to shop</a><h1>Card information</h1><div id="summary"></div><div style="margin:18px 0"><label for="payment-promo">Promo code</label><div style="display:flex;gap:10px;margin-top:8px"><input id="payment-promo" maxlength="32" autocomplete="off" style="min-width:0;flex:1;padding:12px;border:1px solid #333;border-radius:18px;background:#171717;color:#fff;font:inherit"><button type="button" class="btn" id="payment-promo-apply">Apply</button></div><p id="payment-promo-status" role="status"></p></div><form class="form" aria-label="Card information preview" autocomplete="off" onsubmit="return false"><label class="check"><input id="same-cardname" type="checkbox" checked> Name on card same as order name</label><div><label for="cardname">Name on card</label><input id="cardname" placeholder="Name on card" autocomplete="off"></div><div><label for="cardnumber">Card number</label><div class="card-input"><input id="cardnumber" placeholder="1234 5678 9012 3456" inputmode="numeric" autocomplete="off"><span class="brand" id="brand"></span></div></div><div class="triple"><div><label for="month">Month</label><input id="month" placeholder="MM" maxlength="2" inputmode="numeric" autocomplete="off"></div><div><label for="year">Year</label><input id="year" placeholder="YY" maxlength="2" inputmode="numeric" autocomplete="off"></div><div><label for="cvc">Security code</label><input id="cvc" placeholder="CVC" maxlength="3" inputmode="numeric" autocomplete="off"></div></div><label class="check"><input id="same-billing" type="checkbox" checked> Billing address same as shipping address</label><div id="billing" hidden><div><label for="billstreet">Street address</label><input id="billstreet" autocomplete="billing address-line1"></div><div><label for="billcity">City</label><input id="billcity" autocomplete="billing address-level2"></div><div class="pair"><div><label for="billstate">State</label><input id="billstate" autocomplete="billing address-level1"></div><div><label for="billzip">ZIP code</label><input id="billzip" autocomplete="billing postal-code" inputmode="numeric"></div></div></div><p class="demo-note" style="margin:4px 0 0">Card payments coming soon</p><button class="btn big" disabled type="button">Pay now</button></form></div></div></section></main><footer id="ftr"></footer><script src="site.js"></script><script>
let order;try{order=JSON.parse(sessionStorage.getItem('chagPendingOrder')||'null')}catch(e){}
const summary=document.querySelector('#summary'),money=n=>'$'+n.toLocaleString('en-US');
if(order&&order.lines){order.lines.forEach(l=>{const row=document.createElement('div');row.className='summary';const label=document.createElement('span');label.textContent=l.name+' × '+l.q;const price=document.createElement('b');price.textContent=money(l.q*l.u);row.append(label,price);summary.append(row)});const row=document.createElement('div');row.className='tt';const label=document.createElement('span');label.textContent='Total';const total=document.createElement('b');total.id='payment-total';total.textContent=money(order.tot);row.append(label,total);const discount=document.createElement('div');discount.id='payment-discount';discount.className='tt';discount.hidden=true;discount.style.cssText='font-size:inherit;margin-top:14px';discount.innerHTML='<span>Promo discount<small id="payment-code-applied" style="display:block;font-weight:400;margin-top:4px"></small></span><b id="payment-discount-amount"></b>';summary.append(discount,row)}
else{summary.textContent='Your cart is empty. Go back to the shop to add a product.'}

const promoInput=document.querySelector('#payment-promo'),promoButton=document.querySelector('#payment-promo-apply'),promoStatus=document.querySelector('#payment-promo-status');let quoteVersion=0;summary.insertBefore(promoStatus,document.querySelector('#payment-total')?.parentElement||null);
function resetQuote(){quoteVersion++;promoButton.textContent='Apply';document.querySelector('#payment-discount')?.setAttribute('hidden','');if(!order?.lines)return;order.tot=order.lines.reduce((sum,l)=>sum+l.q*l.u,0);order.promo=null;document.querySelector('#payment-total').textContent=money(order.tot);try{sessionStorage.setItem('chagPendingOrder',JSON.stringify(order))}catch(e){}}
promoInput.addEventListener('input',()=>{resetQuote();promoStatus.textContent=''});
promoButton.onclick=async()=>{if(order?.promo){resetQuote();promoInput.value='';promoStatus.textContent='Code removed.';return}if(!order?.lines?.length){promoStatus.textContent='Add a product in the shop first.';return}const code=promoInput.value.trim();resetQuote();const v=quoteVersion;promoButton.disabled=true;promoStatus.textContent='Checking code...';try{const quantity=order.lines.reduce((sum,l)=>sum+l.q,0),r=await fetch('https://ysqbsalasmeufdifvxfh.supabase.co/rest/v1/rpc/chag_promo_quote',{method:'POST',headers:{'Content-Type':'application/json',apikey:'sb_publishable_Bnisx8kOpw9iCeclcW7EDA_iDHp12-3'},body:JSON.stringify({typed_code:code,quantity}),cache:'no-store'});if(!r.ok)throw Error();const q=await r.json();if(v!==quoteVersion)return;if(q.valid){order.tot=q.total_cents/100;order.promo={code,discount_cents:q.discount_cents};promoButton.textContent='Remove code';document.querySelector('#payment-total').textContent=money(order.tot);document.querySelector('#payment-discount').hidden=false;document.querySelector('#payment-code-applied').textContent='Code applied: '+code.toUpperCase();document.querySelector('#payment-discount-amount').textContent='-'+money(q.discount_cents/100);promoStatus.textContent='';try{sessionStorage.setItem('chagPendingOrder',JSON.stringify(order))}catch(e){}}else promoStatus.textContent='Code is invalid, expired or used up.'}catch(e){promoStatus.textContent='Could not check code. Try again.'}finally{promoButton.disabled=false}};
if(order?.promo?.code){const carriedCode=order.promo.code;resetQuote();promoInput.value=carriedCode;promoButton.click()}
const sameName=document.querySelector('#same-cardname'),cardName=document.querySelector('#cardname');
const orderName=order?[order.firstName,order.lastName].filter(Boolean).join(' ').trim():'';
sameName.checked=Boolean(orderName);sameName.disabled=!orderName;
function syncCardName(){cardName.readOnly=sameName.checked;cardName.value=sameName.checked?orderName:''}
syncCardName();sameName.addEventListener('change',()=>{syncCardName();if(!sameName.checked)cardName.focus()});
const same=document.querySelector('#same-billing'),billing=document.querySelector('#billing');same.addEventListener('change',()=>{billing.hidden=same.checked});
const number=document.querySelector('#cardnumber'),brand=document.querySelector('#brand'),month=document.querySelector('#month'),year=document.querySelector('#year'),cvc=document.querySelector('#cvc');
function cardType(n){if(/^3[47]/.test(n))return {name:'AMEX',length:15,cvc:4,groups:[4,6,5]};if(/^4/.test(n))return{name:'VISA',length:16,cvc:3,groups:[4,4,4,4]};if(/^(5[1-5]|2[2-7])/.test(n))return{name:'Mastercard',length:16,cvc:3,groups:[4,4,4,4]};if(/^(6011|65|64[4-9])/.test(n))return{name:'Discover',length:16,cvc:3,groups:[4,4,4,4]};return{name:'',length:16,cvc:3,groups:[4,4,4,4]}}
function formatCard(n,type){let offset=0;return type.groups.map(size=>{const group=n.slice(offset,offset+size);offset+=size;return group}).filter(Boolean).join(' ')}
number.addEventListener('input',()=>{const raw=number.value.replace(/\D/g,'');const type=cardType(raw);const digits=raw.slice(0,type.length);number.value=formatCard(digits,type);brand.textContent=type.name;cvc.maxLength=type.cvc;if(digits.length===type.length)month.focus()});
month.addEventListener('input',()=>{month.value=month.value.replace(/\D/g,'').slice(0,2);if(month.value.length===2&&+month.value>=1&&+month.value<=12)year.focus()});
year.addEventListener('input',()=>{year.value=year.value.replace(/\D/g,'').slice(0,2);if(year.value.length===2)cvc.focus()});
cvc.addEventListener('input',()=>{cvc.value=cvc.value.replace(/\D/g,'').slice(0,+cvc.maxLength);if(cvc.value.length===+cvc.maxLength)same.focus()});
window.addEventListener('pagehide',()=>{[cardName,number,month,year,cvc].forEach(el=>el.value='')});
</script><script src="shop/address.js"></script></body></html>
