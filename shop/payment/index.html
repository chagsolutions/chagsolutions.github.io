.hero{padding:64px 0 40px;text-align:center}

.lead{color:var(--g);max-width:680px;font-size:18px}

.alt{background:var(--k2)}

document.getElementById('card-test-submit').onclick=async()=>{const b=document.getElementById('card-test-submit');b.disabled=true;try{const street=document.getElementById('billstreet').value.trim(),zip=document.getElementById('billzip').value.trim();if(!street||!zip)throw Error('Enter the billing street address and ZIP code.');const d=await testIntent('card');const result=await stripe.confirmCardPayment(d.clientSecret,{payment_method:{card:cardNumber,billing_details:{email:order.email,address:{line1:street,postal_code:zip}}}});if(result.error)throw Error(result.error.message);await displayStatus('card-test-status',result.paymentIntent)}catch(e){document.getElementById('card-test-status').textContent=e.message}finally{b.disabled=false}};
async function loadBank(){const generation=bankGeneration;document.getElementById('ach-test-status').textContent='Loading secure bank fields...';try{bankElements?.getElement('payment')?.destroy();if(generation!==bankGeneration||selectedMethod!=='ach')return;bankElements=stripe.elements({mode:'payment',amount:Math.round((subtotal-promoDiscount)*100),currency:'usd',paymentMethodTypes:['us_bank_account'],appearance:{theme:dark?'night':'stripe',variables:{colorPrimary:'#ff7800',colorBackground:dark?'#171717':'#ffffff',colorText:dark?'#ffffff':'#111111',colorTextSecondary:dark?'#cccccc':'#555555',fontFamily:'Arial, sans-serif',fontSizeBase:'16px',fontLineHeight:'20px',spacingUnit:'3px',borderRadius:'14px'},rules:{'.Input':{border:'1px solid #333333',boxShadow:'none',padding:'14px',height:'50px',boxSizing:'border-box',lineHeight:'20px'},'.Input:focus':{border:'1px solid #ff7800',boxShadow:'0 0 0 1px #ff7800'},'.Label':{color:dark?'#cccccc':'#555555',fontSize:'14px'},'.Tab':{borderRadius:'14px'}}}});bankElements.create('payment',{fields:{billingDetails:{name:'never',email:'never'}}}).mount('#stripe-bank-element');document.getElementById('ach-test-submit').disabled=false;document.getElementById('ach-test-status').textContent=''}catch(e){if(generation===bankGeneration)document.getElementById('ach-test-status').textContent=e.message}};
document.getElementById('ach-test-submit').onclick=async()=>{const b=document.getElementById('ach-test-submit');b.disabled=true;try{const person=achPerson();if(!person.name||!person.email||(!sameAchPerson.checked&&!document.getElementById('ach-email').checkValidity()))throw Error('Enter the bank account holder name and a valid email.');const submit=await bankElements.submit();if(submit.error)throw Error(submit.error.message);const d=await testIntent('ach');const result=await stripe.confirmPayment({elements:bankElements,clientSecret:d.clientSecret,confirmParams:{return_url:location.href,payment_method_data:{billing_details:person}},redirect:'if_required'});if(result.error)throw Error(result.error.message);await displayStatus('ach-test-status',result.paymentIntent)}catch(e){document.getElementById('ach-test-status').textContent=e.message}finally{b.disabled=false}};

document.getElementById('cashapp-test-submit').onclick=async()=>{const b=document.getElementById('cashapp-test-submit');b.disabled=true;try{const d=await testIntent('cashapp');const result=await stripe.confirmCashappPayment(d.clientSecret,{payment_method:{type:'cashapp',billing_details:{name:[order.firstName,order.lastName].join(' '),email:order.email}},return_url:location.origin+location.pathname});if(result.error)throw Error(result.error.message);if(result.paymentIntent)await displayStatus('cashapp-test-status',result.paymentIntent)}catch(e){document.getElementById('cashapp-test-status').textContent=e.message}finally{b.disabled=false}};
let appleElements,appleGeneration=0;
async function loadApple(){const gen=++appleGeneration;const status=document.getElementById('apple-test-status');status.textContent='';appleElements?.getElement('expressCheckout')?.destroy();appleElements=stripe.elements({mode:'payment',amount:Math.round((subtotal-promoDiscount)*100),currency:'usd',paymentMethodTypes:['card'],appearance:{theme:dark?'night':'stripe',variables:{borderRadius:'24px'}}});const wallet=appleElements.create('expressCheckout',{paymentMethods:{applePay:'auto',googlePay:'never',link:'never',amazonPay:'never',paypal:'never',klarna:'never'},buttonHeight:Math.round(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--btn-h'))-2*parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--btn-border'))),buttonTheme:{applePay:dark?'black':'white-outline'}});wallet.on('ready',e=>{if(gen!==appleGeneration)return;status.textContent=e.availablePaymentMethods?.applePay?'':'Apple Pay is not available on this device. Choose another payment method.'});wallet.on('confirm',async e=>{try{const submit=await appleElements.submit();if(submit.error)throw Error(submit.error.message);const d=await testIntent('apple_pay');const result=await stripe.confirmPayment({elements:appleElements,clientSecret:d.clientSecret,confirmParams:{return_url:location.origin+location.pathname},redirect:'if_required'});if(result.error)throw Error(result.error.message);if(result.paymentIntent)await displayStatus('apple-test-status',result.paymentIntent)}catch(err){status.textContent=err.message;e.paymentFailed?.({reason:'fail'})}});wallet.mount('#stripe-apple-element')};
document.getElementById('payment-promo').addEventListener('input',()=>{if(selectedMethod==='apple_pay')loadApple()});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',e=>{dark=e.matches;const base={...style.base,color:dark?'#fff':'#111'};['cardNumber','cardExpiry','cardCvc'].forEach(type=>cardElements.getElement(type)?.update({style:{base}}));resetBank();if(selectedMethod==='ach')loadBank();if(selectedMethod==='apple_pay')loadApple()});
</script><script>if(!validCart){document.getElementById('summary').textContent='Your cart is empty. Go back to the shop.';document.querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('wa').removeAttribute('href');}</script></body></html>
