const sample={firstName:'Synthetic',lastName:'Fixture',phone:'212-555-0100',email:'fixture@example.invalid',street:'20 Washington Avenue',city:'Suffern',state:'NY',zip:'10901',lines:[{name:'TETRIPH',q:1,u:1200,product_id:'d211d7cb-5d9e-4550-9781-5643c8a344b8'}],tot:1200,promo:null};let order;try{order=JSON.parse(sessionStorage.getItem('chagShopOrder'))}catch(e){}const validCart=order&&Array.isArray(order.lines)&&order.lines.length&&order.lines.every(l=>typeof l.name==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(l.product_id||'')&&Number.isInteger(l.q)&&l.q>0&&l.q<=999);order=validCart?order:sample;const money=n=>'$'+n.toLocaleString('en-US');let selectedMethod='online',promoDiscount=0;const subtotal=order.lines.reduce((n,l)=>n+l.q*l.u,0),originalSubtotal=order.lines.reduce((n,l)=>n+l.q*(l.regularPrice||l.u),0);const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderSummary(){const cashDiscount=selectedMethod==='cash'?125*order.lines.reduce((n,l)=>n+l.q,0):0;document.getElementById('summary').innerHTML=order.lines.map(l=>'<div class="summary"><span>'+esc(l.name)+' x '+l.q+'<small style="display:block;color:#888">'+money(l.u)+' each</small></span><b>'+money(l.q*l.u)+'</b></div>').join('')+(originalSubtotal>subtotal?'<div class="summary"><span>Quantity discount</span><b>-'+money(originalSubtotal-subtotal)+'</b></div>':'')+(promoDiscount?'<div class="summary"><span>Promo discount</span><b>-'+money(promoDiscount)+'</b></div>':'')+(cashDiscount?'<div class="summary"><span>Cash discount</span><b>-'+money(cashDiscount)+'</b></div>':'')+'<div class="summary"><b>Total</b><b id="payment-total">'+money(Math.max(0,subtotal-promoDiscount-cashDiscount))+'</b></div>';}renderSummary();document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{selectedMethod=b.dataset.method;document.querySelectorAll('[data-method]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('online-panel').hidden=selectedMethod==='cash';document.getElementById('cash-panel').hidden=selectedMethod!=='cash';renderSummary();syncCashWhatsApp();});
let acceptedPromo='';document.getElementById('apply').onclick=async()=>{const b=document.getElementById('apply'),input=document.getElementById('payment-promo'),note=document.getElementById('promo-message');if(acceptedPromo){acceptedPromo='';promoDiscount=0;input.value='';input.disabled=false;b.textContent='Apply';note.textContent='';renderSummary();return}const code=input.value.trim().toUpperCase();if(!code)return;b.disabled=true;try{const r=await fetch(sandboxEndpoint+'/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:'card',promo_code:code,lines:order.lines.map(l=>({product_id:l.product_id,quantity:l.q}))})});const q=await r.json();if(!r.ok)throw Error('Promo unavailable');acceptedPromo=code;promoDiscount=q.discount_cents/100;input.disabled=true;b.textContent='Remove';note.textContent='Promo applied';renderSummary()}catch(e){note.textContent=e.message}finally{b.disabled=false}};document.getElementById('payment-promo').addEventListener('input',()=>{promoDiscount=0;renderSummary();document.getElementById('promo-message').textContent=''});

</script><script>// Isolated staging only. No production database or email writes.

function mountCheckout(){if(!validCart)return;checkoutElements=stripe.elements({mode:'payment',amount:Math.round((subtotal-promoDiscount)*100),currency:'usd',paymentMethodTypes:['card','cashapp','us_bank_account'],appearance});expressElement=checkoutElements.create('expressCheckout',{paymentMethods:{applePay:'auto',googlePay:'never',link:'never',amazonPay:'never',paypal:'never',klarna:'never'},buttonHeight:48});expressElement.mount('#stripe-express-element');expressElement.on('ready',e=>{document.getElementById('stripe-express-element').hidden=!e.availablePaymentMethods?.applePay;});expressElement.on('confirm',()=>submitOnline('card'));paymentElement=checkoutElements.create('payment',{layout:{type:'tabs',defaultCollapsed:false},paymentMethodOrder:['card','cashapp','us_bank_account'],wallets:{applePay:'never',googlePay:'never'},defaultValues:{billingDetails:{name:[order.firstName,order.lastName].join(' ').trim(),email:order.email,address:{line1:order.street,city:order.city,state:order.state,postal_code:order.zip,country:'US'}}}});paymentElement.mount('#stripe-payment-element');}

async function testIntent(method){
 if(!validCart)throw Error('Your cart is empty. Go back to the shop.');const fingerprint=JSON.stringify({method,order,promo:acceptedPromo});

async function displayStatus(pi){const response=await fetch(sandboxEndpoint+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientSecret:pi.client_secret})});const state=await response.json();if(!response.ok||!state.sandbox)throw Error(state.error||'Unable to verify payment state.');if(state.page){sessionStorage.setItem('chagShopCompletion',JSON.stringify({...state,amount:state.amount/100,at:Date.now()}));sessionStorage.removeItem('chagShopOrder');location.replace(state.page==='success'?'success.html':'pending.html');}else status.textContent='Payment status: '+state.status+'. Please check your payment details.';}
