<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Order placed - CHAG sandbox</title><style>@import url("theme.css");
:root{--o:#ff7800;--k:#0d0d0d;--k2:#171717;--w:#fff;--g:#b8b8b8}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--k);color:var(--w);font-family:Montserrat,"Segoe UI",system-ui,Arial,sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}img,video{max-width:100%;display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:9;background:rgba(13,13,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid #222}
header .wrap{display:flex;align-items:center;gap:22px;height:64px}
header img{height:30px}header nav{display:flex;gap:20px;margin-left:auto;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em}
header nav a:hover{color:var(--o)}
.btn{display:inline-block;background:var(--o);color:#000;font-weight:800;border-radius:999px;padding:14px 26px;font-size:16px;border:2px solid var(--o);cursor:pointer}
.btn.ghost{background:transparent;color:#fff;border-color:#444}.btn.ghost:hover{border-color:var(--o);color:var(--o)}
.btn.off{background:#2a2a2a;color:#888;border-color:#2a2a2a;pointer-events:none}
.hero{padding:64px 0 40px;text-align:center}
.hero h1{font-size:clamp(34px,7.5vw,76px);line-height:1.02;margin:0 0 18px;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--o)}
.hero p{color:var(--g);font-size:clamp(16px,2.4vw,21px);max-width:640px;margin:0 auto 28px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.price-tag{margin-top:26px;color:var(--g);font-size:15px}.price-tag b{color:#fff}
.comic{padding:30px 0 70px}
.comic .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.comic figure{margin:0;position:relative;border-radius:22px;overflow:hidden;border:3px solid #000;box-shadow:0 0 0 2px #2a2a2a}
.comic img{width:100%;aspect-ratio:9/16;object-fit:cover}
.bubble{position:absolute;left:12px;right:12px;background:#fff;color:#000;font-weight:900;text-transform:uppercase;border-radius:16px;padding:12px 14px;font-size:clamp(13px,2.6vw,20px);text-align:center;line-height:1.15}
.bubble.top{top:12px}.bubble.bot{bottom:12px}.bubble b{color:var(--o)}
.video{margin-top:18px;border-radius:22px;overflow:hidden;border:2px solid #2a2a2a;max-width:340px;margin-inline:auto}
section{padding:70px 0}
h2{font-size:clamp(28px,5vw,46px);line-height:1.05;margin:0 0 14px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
h2 em{font-style:normal;color:var(--o)}
.lead{color:var(--g);max-width:680px;font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:30px}
.card{background:var(--k2);border:1px solid #262626;border-radius:20px;padding:26px}
.card .n{color:var(--o);font-weight:900;font-size:14px;letter-spacing:.1em}
.card h3{margin:6px 0 8px;font-size:22px}.card p{margin:0;color:var(--g)}
.alt{background:var(--k2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:30px}
.prod{background:var(--k);border:1px solid #2a2a2a;border-radius:22px;overflow:hidden}
.prod img{width:100%;aspect-ratio:1;object-fit:cover}
.prod .b{padding:22px}.prod h3{margin:0;font-size:26px;font-weight:900}.prod .pr{color:var(--o);font-size:30px;font-weight:900;margin:4px 0 8px}
.prod p{color:var(--g);margin:0 0 16px;font-size:15px}.prod .btn{display:block;text-align:center;margin-top:10px}
.about p{color:#d6d6d6;font-size:18px;max-width:760px}
footer{padding:50px 0;border-top:1px solid #222;text-align:center;color:var(--g)}
footer img{height:44px;margin:0 auto 18px}footer a{color:#fff;font-weight:700}
@media(max-width:560px){.comic .row{grid-template-columns:1fr}.comic{padding-bottom:30px}header nav{gap:12px;font-size:12px}header img{height:24px}.hero{padding-top:40px}}
.prod .pr small{font-size:15px;color:#fff;font-weight:700}.prod .nb{color:#fff;font-weight:700;margin:0 0 10px}
.prod .nb span{background:var(--o);color:#000;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:900;margin-right:6px}.sp{color:var(--o);font-weight:700}

header nav a.on{color:var(--o)}
.page{padding:60px 0 20px}.page h1{font-size:clamp(34px,6vw,60px);line-height:1.02;margin:0 0 16px;font-weight:900;text-transform:uppercase}.page h1 em{font-style:normal;color:var(--o)}
.story{display:flex;flex-direction:column-reverse;gap:18px;margin:46px 0;max-width:760px}
.story .pic img{width:100%;margin:0 auto;border-radius:20px;border:2px solid #2a2a2a}.story h2{margin-bottom:10px}.story p{color:#d6d6d6;font-size:18px}
.banner{margin:30px 0}.banner img{width:100%;max-width:520px;margin:0 auto;border-radius:20px;border:2px solid #2a2a2a}
.form{display:grid;gap:12px;max-width:520px;margin-top:20px}.form input,.form textarea{background:#171717;border:1px solid #333;border-radius:14px;color:#fff;padding:14px;font:inherit}
.cbtns{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}
.video{max-width:360px}
.watch .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:30px 0}.watch figure{margin:0;border-radius:22px;overflow:hidden;border:3px solid #000;box-shadow:0 0 0 2px #2a2a2a}.watch img{width:100%}
@media(max-width:700px){.watch .row{grid-template-columns:1fr}}

.cartbox{margin:40px 0;max-width:640px;background:#141414;border:2px solid #2a2a2a;border-radius:20px;padding:24px}.cartbox h2{margin:0 0 14px}.cartbox em{font-style:normal;color:#FF7800}
.ln{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2a2a2a}.ln small{color:#aaa}.qty{display:flex;align-items:center;gap:10px}.qty button{width:38px;height:38px;border-radius:50%;border:2px solid #FF7800;background:none;color:#fff;font-size:22px;cursor:pointer}.qty span{min-width:22px;text-align:center;font-weight:800}.lt{font-weight:800;min-width:84px;text-align:right}
.tt{display:flex;justify-content:space-between;font-size:24px;padding:16px 0 4px}.svl{color:#cfcfcf;font-size:15px}.svl .good{color:#FF7800;font-weight:800}
.cartbox pre{white-space:pre-wrap;background:#0c0c0c;border-radius:12px;padding:14px;font-size:14px;color:#ddd}
.deal{display:inline-block;background:#FF7800;color:#000;font-weight:900;font-size:clamp(15px,4.3vw,24px);line-height:1.25;padding:10px 12px;display:block;text-align:center;border-radius:12px;margin:10px 0 16px}.qty.big{justify-content:center;gap:22px}.qty.big button{width:56px;height:56px;font-size:30px}.qty.big span{font-size:30px;min-width:40px}.btn.big{display:block;box-sizing:border-box;width:100%;font-size:20px;line-height:24px;padding:16px 20px;border-radius:16px;text-align:center;margin:12px 0 0;font-family:inherit}.btn.big:disabled{opacity:.4}.cartbox .form{gap:12px}.prod .b{text-align:center}.prod .pr{justify-content:center}.cartbox .form{max-width:none}.cartbox input{font-size:18px;padding:16px}.svl{color:#FF7800;font-weight:800;min-height:22px;font-size:18px}
@media(max-width:480px){header .wrap{gap:8px;padding:0 12px}header nav{gap:9px;font-size:11px;letter-spacing:.02em}.cartbox{padding:18px}.ln{flex-wrap:wrap}}

/* Uniform action style, approved October 8. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;min-height:48px;padding:10px 24px;line-height:1.35}.btn.big{min-height:52px}.btn.small{min-height:44px;padding:8px 16px}.btn+.btn{margin-left:12px}.actions,.cta,.buttons{display:flex;flex-wrap:wrap;gap:12px}.actions>.btn,.cta>.btn,.buttons>.btn{margin-left:0}.qty{gap:12px}.qty button{border-radius:999px;min-width:44px;min-height:44px}.form>.btn,form>.btn{margin-top:20px}.field-row{gap:16px}
.form .btn,.cartbox .btn,.payment .btn{border-radius:999px;min-height:48px;font-size:16px;padding:10px 24px}.form>#wa,.form>#sb{width:100%;margin-left:0}.form>#wa{margin-top:12px}.qty button{width:44px;height:44px;min-height:44px}.location-use{min-height:44px;padding:10px 0}.btn+.btn{margin-left:0}.btn.small{min-height:44px;font-size:14px}.field-row,.address-row,.pair,.triple{gap:16px}

.page.wrap{padding-left:20px;padding-right:20px}.form>button.btn+button.btn{margin-top:0}.form>button.btn[type=button]{margin-top:0}.form>button.btn[type=submit]{margin-top:20px}.cbtns{gap:12px}.cbtns .btn{margin-left:0}

.cl b{color:#ff7800}

/* Equal outer heights including borders and inline page rules. */
.btn,.form .btn,.cartbox .btn,.payment .btn{box-sizing:border-box;height:48px;min-height:48px;padding-top:0!important;padding-bottom:0!important;line-height:1.35}.qty.big button{width:44px;height:44px}.form #wa{height:48px}.btn.small{height:44px;min-height:44px}
</style><style>main{max-width:640px;margin:32px auto;padding:20px}.status-card{border:1px solid #25a56a;border-radius:24px;padding:24px}.symbol{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#198754;color:white;font-size:32px;margin-bottom:20px}h1{font-size:32px;line-height:1.2}.tag{font-size:12px;color:#888}p{line-height:1.6}.detail{padding:12px 0;border-top:1px solid #555}a{color:#ff7800}</style></head><body><main><p class="tag">SANDBOX DESIGN PREVIEW. No real order or money.</p><section class="status-card"><div class="symbol" aria-hidden="true">✓</div><h1>THANK YOU FOR YOUR ORDER.</h1><p>Your purchase has been placed.</p><p id="payment-message">Your order has been processed.</p><p id="total" class="detail"></p></section><p><a href="index.html" id="restart">Start another sandbox test</a></p><p class="tag">This preview does not save a real order or send email.</p></main><script>let c;try{c=JSON.parse(sessionStorage.getItem('chagSandboxCompletion'))}catch{};if(c&&c.status==='succeeded')document.getElementById('payment-message').textContent='Your payment was successful.';if(c)document.getElementById('total').textContent='Test total: $'+c.amount.toLocaleString('en-US');document.getElementById('restart').onclick=()=>{sessionStorage.removeItem('chagSandboxCompletion');sessionStorage.removeItem('chagSandboxOrder');sessionStorage.removeItem('chagSandboxAttempt')};</script></body></html>
