const sandboxEndpoint='https://ysqbsalasmeufdifvxfh.supabase.co/functions/v1/chag-stripe-sandbox';

async function testIntent(method){
 const fingerprint=method+'|'+order.lines.reduce((n,l)=>n+l.q,0)+'|'+document.getElementById('payment-promo').value.trim().toUpperCase();
 let attempt;try{attempt=JSON.parse(sessionStorage.getItem('chagSandboxAttempt'))}catch{};
 if(!attempt||attempt.fingerprint!==fingerprint){attempt={fingerprint,id:crypto.randomUUID()};sessionStorage.setItem('chagSandboxAttempt',JSON.stringify(attempt))};

};
