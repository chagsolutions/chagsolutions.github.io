<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ads - Chag Solutions</title><meta name="description" content="TETRIPH: a mechanical, non-electrical system for hot water from a tankless heater on Yom Tov."><link rel="stylesheet" href="style.css"></head><body><header id="hdr"></header><main><div class="wrap page watch"><h1>Our <em>ads</em></h1><div id="ads"></div></div></main><footer id="ftr"></footer><script src="site.js"></script><script>fetch("ads.json").then(r=>r.json()).then(a=>{document.getElementById("ads").innerHTML=a.map(x=>`<section style="padding:30px 0;border-top:1px solid #222">${x.title?`<h2 style="font-size:clamp(22px,4vw,34px)">${x.title}</h2>`:""}${x.caption?`<p class="lead">${x.caption}</p>`:""}${x.images&&x.images.length?`<div class="row">${x.images.map(i=>`<figure><img src="${i}" alt=""></figure>`).join("")}</div>`:""}${x.video?`<div style="text-align:center"><video controls playsinline preload="metadata" style="width:100%;max-width:360px;margin:auto;border-radius:22px;border:3px solid #000;box-shadow:0 0 0 2px #FF7800" src="${x.video}"></video></div>`:""}</section>`).join("")})</script></body></html>
